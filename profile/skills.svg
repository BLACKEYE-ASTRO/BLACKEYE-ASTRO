
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="422" viewBox="0 0 1200 422" fill="none" role="img" aria-label="Languages and tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080808"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity=".055" fill="none"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="32 32" dur="6s" repeatCount="indefinite"/>
    </pattern>

    <clipPath id="card">
      <rect width="1200" height="422" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="422" rx="18" fill="url(#bg)"/>
    <rect width="1200" height="422" rx="18" fill="url(#grid)"/>

    <!-- Header -->
    <text x="60" y="52" fill="#60A5FA" font-family="'Fira Code', Consolas, monospace" font-size="14">&lt; TECH STACK /&gt;</text>
    <text x="60" y="92" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="30" font-weight="700">Languages and tools</text>
    <line x1="60" y1="114" x2="1140" y2="114" stroke="#FFFFFF" stroke-opacity=".06"/>

    <!-- LANGUAGES -->
    <rect x="60" y="136" width="3" height="24" rx="1.5" fill="#60A5FA"/>
    <text x="76" y="154" fill="#60A5FA" font-family="'Fira Code', Consolas, monospace" font-size="14" letter-spacing="2">LANGUAGES</text>

    <!-- JavaScript -->
    <g>
      <rect x="270" y="128" width="142" height="40" rx="10" fill="#111827" stroke="#F7DF1E" stroke-opacity=".65"/>
      <circle cx="290" cy="148" r="4" fill="#F7DF1E"/>
      <text x="306" y="153.5" fill="#FFFFFF" font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="700">JavaScript</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- HTML5 -->
    <g>
      <rect x="426" y="128" width="97" height="40" rx="10" fill="#111827" stroke="#E34F26" stroke-opacity=".65"/>
      <circle cx="446" cy="148" r="4" fill="#E34F26"/>
      <text x="462" y="153.5" fill="#FFFFFF" font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="700">HTML5</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" begin="-.8s" repeatCount="indefinite"/>
    </g>

    <!-- CSS3 -->
    <g>
      <rect x="537" y="128" width="88" height="40" rx="10" fill="#111827" stroke="#1572B6" stroke-opacity=".65"/>
      <circle cx="557" cy="148" r="4" fill="#1572B6"/>
      <text x="573" y="153.5" fill="#FFFFFF" font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="700">CSS3</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" begin="-1.6s" repeatCount="indefinite"/>
    </g>

    <line x1="60" y1="186" x2="1140" y2="186" stroke="#FFFFFF" stroke-opacity=".06"/>

    <!-- FRONTEND -->
    <rect x="60" y="208" width="3" height="24" rx="1.5" fill="#60A5FA"/>
    <text x="76" y="226" fill="#60A5FA" font-family="'Fira Code', Consolas, monospace" font-size="14" letter-spacing="2">FRONTEND</text>

    <!-- React -->
    <g>
      <rect x="270" y="200" width="124" height="40" rx="10" fill="#111827" stroke="#61DAFB" stroke-opacity=".65"/>
      <circle cx="290" cy="220" r="4" fill="#61DAFB"/>
      <text x="306" y="225.5" fill="#FFFFFF" font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="700">React.js</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" begin="-2.4s" repeatCount="indefinite"/>
    </g>

    <!-- Next -->
    <g>
      <rect x="408" y="200" width="115" height="40" rx="10" fill="#111827" stroke="#FFFFFF" stroke-opacity=".65"/>
      <circle cx="428" cy="220" r="4" fill="#FFFFFF"/>
      <text x="444" y="225.5" fill="#FFFFFF" font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="700">Next.js</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" begin="-3.2s" repeatCount="indefinite"/>
    </g>

    <!-- Tailwind -->
    <g>
      <rect x="537" y="200" width="160" height="40" rx="10" fill="#111827" stroke="#06B6D4" stroke-opacity=".65"/>
      <circle cx="557" cy="220" r="4" fill="#06B6D4"/>
      <text x="573" y="225.5" fill="#FFFFFF" font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="700">Tailwind CSS</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" begin="-4s" repeatCount="indefinite"/>
    </g>

    <!-- Chakra -->
    <g>
      <rect x="711" y="200" width="133" height="40" rx="10" fill="#111827" stroke="#319795" stroke-opacity=".65"/>
      <circle cx="731" cy="220" r="4" fill="#319795"/>
      <text x="747" y="225.5" fill="#FFFFFF" font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="700">Chakra UI</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" begin="-4.8s" repeatCount="indefinite"/>
    </g>

    <!-- Bootstrap -->
    <g>
      <rect x="858" y="200" width="133" height="40" rx="10" fill="#111827" stroke="#7952B3" stroke-opacity=".65"/>
      <circle cx="878" cy="220" r="4" fill="#7952B3"/>
      <text x="894" y="225.5" fill="#FFFFFF" font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="700">Bootstrap</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- Redux -->
    <g>
      <rect x="1005" y="200" width="97" height="40" rx="10" fill="#111827" stroke="#764ABC" stroke-opacity=".65"/>
      <circle cx="1025" cy="220" r="4" fill="#764ABC"/>
      <text x="1041" y="225.5" fill="#FFFFFF" font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="700">Redux</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" begin="-.8s" repeatCount="indefinite"/>
    </g>

    <line x1="60" y1="258" x2="1140" y2="258" stroke="#FFFFFF" stroke-opacity=".06"/>

    <!-- BACKEND -->
    <rect x="60" y="280" width="3" height="24" rx="1.5" fill="#60A5FA"/>
    <text x="76" y="298" fill="#60A5FA" font-family="'Fira Code', Consolas, monospace" font-size="14" letter-spacing="2">BACKEND &amp; DATA</text>

    <!-- Node -->
    <g>
      <rect x="270" y="272" width="115" height="40" rx="10" fill="#111827" stroke="#5FA04E" stroke-opacity=".65"/>
      <circle cx="290" cy="292" r="4" fill="#5FA04E"/>
      <text x="306" y="297.5" fill="#FFFFFF" font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="700">Node.js</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" begin="-1.6s" repeatCount="indefinite"/>
    </g>

    <!-- MongoDB -->
    <g>
      <rect x="399" y="272" width="115" height="40" rx="10" fill="#111827" stroke="#47A248" stroke-opacity=".65"/>
      <circle cx="419" cy="292" r="4" fill="#47A248"/>
      <text x="435" y="297.5" fill="#FFFFFF" font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="700">MongoDB</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" begin="-2.4s" repeatCount="indefinite"/>
    </g>

    <!-- REST APIs -->
    <g>
      <rect x="528" y="272" width="133" height="40" rx="10" fill="#111827" stroke="#60A5FA" stroke-opacity=".65"/>
      <circle cx="548" cy="292" r="4" fill="#60A5FA"/>
      <text x="564" y="297.5" fill="#FFFFFF" font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="700">REST APIs</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" begin="-3.2s" repeatCount="indefinite"/>
    </g>

    <line x1="60" y1="330" x2="1140" y2="330" stroke="#FFFFFF" stroke-opacity=".06"/>

    <!-- TOOLS -->
    <rect x="60" y="352" width="3" height="24" rx="1.5" fill="#93C5FD"/>
    <text x="76" y="370" fill="#93C5FD" font-family="'Fira Code', Consolas, monospace" font-size="14" letter-spacing="2">TOOLS</text>

    <!-- Git -->
    <g>
      <rect x="270" y="344" width="79" height="40" rx="10" fill="#111827" stroke="#F05032" stroke-opacity=".65"/>
      <circle cx="290" cy="364" r="4" fill="#F05032"/>
      <text x="306" y="369.5" fill="#FFFFFF" font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="700">Git</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" begin="-4s" repeatCount="indefinite"/>
    </g>

    <!-- GitHub -->
    <g>
      <rect x="363" y="344" width="106" height="40" rx="10" fill="#111827" stroke="#FFFFFF" stroke-opacity=".65"/>
      <circle cx="383" cy="364" r="4" fill="#FFFFFF"/>
      <text x="399" y="369.5" fill="#FFFFFF" font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="700">GitHub</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" begin="-4.8s" repeatCount="indefinite"/>
    </g>

    <!-- Figma -->
    <g>
      <rect x="483" y="344" width="97" height="40" rx="10" fill="#111827" stroke="#F24E1E" stroke-opacity=".65"/>
      <circle cx="503" cy="364" r="4" fill="#F24E1E"/>
      <text x="519" y="369.5" fill="#FFFFFF" font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="700">Figma</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- Floating code elements -->
    <g font-family="'Fira Code', Consolas, monospace" fill="#60A5FA">
      <text x="908" y="79" font-size="14" opacity="0">
        0
        <animate attributeName="opacity" values="0;.55;0" dur="5.7s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 12;0 -44" dur="5.7s" repeatCount="indefinite"/>
      </text>
      <text x="926" y="105" font-size="16" opacity="0">
        &lt;/&gt;
        <animate attributeName="opacity" values="0;.55;0" dur="6.3s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 12;0 -44" dur="6.3s" repeatCount="indefinite"/>
      </text>
      <text x="718" y="79" font-size="12" opacity="0">
        &amp;&amp;
        <animate attributeName="opacity" values="0;.55;0" dur="8.8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 12;0 -44" dur="8.8s" repeatCount="indefinite"/>
      </text>
      <text x="807" y="66" font-size="12" opacity="0">
        ()
        <animate attributeName="opacity" values="0;.55;0" dur="8.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 12;0 -44" dur="8.5s" repeatCount="indefinite"/>
      </text>
      <text x="1048" y="79" font-size="12" opacity="0">
        &lt;/&gt;
        <animate attributeName="opacity" values="0;.55;0" dur="8.7s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 12;0 -44" dur="8.7s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="420" rx="17" stroke="#60A5FA" stroke-opacity=".35" fill="none"/>

  <!-- Corner details -->
  <path d="M12 30V12H30M1170 12H1188V30M1188 392V410H1170M30 410H12V392"
        stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-opacity=".8" fill="none">
    <animate attributeName="stroke-opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/>
  </path>
</svg>
