<svg xmlns="http://www.w3.org/2000/svg" width="340" height="230" viewBox="0 0 340 230" fill="none" role="img" aria-label="Top languages">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080808"/><stop offset="1" stop-color="#19130D"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F59E0B"/><stop offset="1" stop-color="#D97706"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity=".055" fill="none"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="32 32" dur="6s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="card"><rect width="340" height="230" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="340" height="230" rx="18" fill="url(#bg)"/>
    <rect width="340" height="230" rx="18" fill="url(#grid)"/>
    <text x="30" y="52" fill="#F59E0B" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="16" font-weight="700">&lt; TOP LANGUAGES /&gt;</text>
    <clipPath id="bar"><rect x="30" y="68" width="280" height="10" rx="5"/></clipPath>
    <rect x="30" y="68" width="280" height="10" rx="5" fill="#2A2014"/>
    <g clip-path="url(#bar)"></g>
    <text x="30" y="118" fill="#888888" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="13">waiting for first run</text>
  </g>
  <rect x="1" y="1" width="338" height="228" rx="17" stroke="#D97706" stroke-opacity=".35" fill="none"/>
  <path d="M12 28V12H28M312 12H328V28M328 202V218H312M28 218H12V202" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-opacity=".8" fill="none"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/></path>
</svg>
