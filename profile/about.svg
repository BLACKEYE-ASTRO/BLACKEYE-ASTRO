
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="434" viewBox="0 0 1200 434" fill="none" role="img" aria-label="About Akash, terminal style">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080808"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity=".055" fill="none"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="32 32" dur="6s" repeatCount="indefinite"/>
    </pattern>

    <clipPath id="card">
      <rect width="1200" height="434" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="434" rx="18" fill="url(#bg)"/>
    <rect width="1200" height="434" rx="18" fill="url(#grid)"/>

    <path d="M0 18 a18 18 0 0 1 18 -18 H1182 a18 18 0 0 1 18 18 V50 H0 Z" fill="#111827"/>
    <line x1="0" y1="50" x2="1200" y2="50" stroke="#60A5FA" stroke-opacity=".35"/>

    <circle cx="32" cy="25" r="7" fill="#EF4444"/>
    <circle cx="56" cy="25" r="7" fill="#F59E0B"/>
    <circle cx="80" cy="25" r="7" fill="#22C55E"/>

    <text x="600" y="30" text-anchor="middle" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="14" fill="#9CA3AF">akash@black-eye: ~/profile</text>

    <text x="48" y="108" xml:space="preserve" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="17" opacity="1">
      <tspan fill="#60A5FA">$</tspan><tspan fill="#FFFFFF"> whoami</tspan>
      <animate attributeName="opacity" keyTimes="0;0.052;0.082;0.930;0.980;1" values="0;0;1;1;0;0" dur="11.6s" repeatCount="indefinite"/>
    </text>

    <text x="48" y="136" xml:space="preserve" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="17" opacity="1">
      <tspan fill="#93C5FD">akash_shingare // full stack developer &amp; product builder</tspan>
      <animate attributeName="opacity" keyTimes="0;0.112;0.142;0.930;0.980;1" values="0;0;1;1;0;0" dur="11.6s" repeatCount="indefinite"/>
    </text>

    <text x="48" y="164" xml:space="preserve" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="17" opacity="1">
      <tspan fill="#60A5FA">$</tspan><tspan fill="#FFFFFF"> cat about.md</tspan>
      <animate attributeName="opacity" keyTimes="0;0.172;0.202;0.930;0.980;1" values="0;0;1;1;0;0" dur="11.6s" repeatCount="indefinite"/>
    </text>

    <text x="48" y="192" xml:space="preserve" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="17" opacity="1">
      <tspan fill="#60A5FA">&gt;</tspan><tspan fill="#D1D5DB"> Building responsive, dynamic web apps with React.js, Next.js and Node.js</tspan>
      <animate attributeName="opacity" keyTimes="0;0.233;0.263;0.930;0.980;1" values="0;0;1;1;0;0" dur="11.6s" repeatCount="indefinite"/>
    </text>

    <text x="48" y="220" xml:space="preserve" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="17" opacity="1">
      <tspan fill="#60A5FA">&gt;</tspan><tspan fill="#D1D5DB"> Clean, user-friendly interfaces with Tailwind CSS and Chakra UI</tspan>
      <animate attributeName="opacity" keyTimes="0;0.293;0.323;0.930;0.980;1" values="0;0;1;1;0;0" dur="11.6s" repeatCount="indefinite"/>
    </text>

    <text x="48" y="248" xml:space="preserve" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="17" opacity="1">
      <tspan fill="#60A5FA">&gt;</tspan><tspan fill="#D1D5DB"> Obsessed with performance and a smooth user experience</tspan>
      <animate attributeName="opacity" keyTimes="0;0.353;0.383;0.930;0.980;1" values="0;0;1;1;0;0" dur="11.6s" repeatCount="indefinite"/>
    </text>

    <text x="48" y="276" xml:space="preserve" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="17" opacity="1">
      <tspan fill="#60A5FA">&gt;</tspan><tspan fill="#D1D5DB"> REST APIs, Redux, MongoDB, and efficient fixes for complex problems</tspan>
      <animate attributeName="opacity" keyTimes="0;0.414;0.444;0.930;0.980;1" values="0;0;1;1;0;0" dur="11.6s" repeatCount="indefinite"/>
    </text>

    <text x="48" y="304" xml:space="preserve" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="17" opacity="1">
      <tspan fill="#60A5FA">&gt;</tspan><tspan fill="#D1D5DB"> Always exploring the latest in web development</tspan>
      <animate attributeName="opacity" keyTimes="0;0.474;0.504;0.930;0.980;1" values="0;0;1;1;0;0" dur="11.6s" repeatCount="indefinite"/>
    </text>

    <text x="48" y="332" xml:space="preserve" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="17" opacity="1">
      <tspan fill="#60A5FA">$</tspan><tspan fill="#FFFFFF"> open --to collaborations jobs</tspan>
      <animate attributeName="opacity" keyTimes="0;0.534;0.564;0.930;0.980;1" values="0;0;1;1;0;0" dur="11.6s" repeatCount="indefinite"/>
    </text>

    <text x="48" y="360" xml:space="preserve" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="17" opacity="1">
      <tspan fill="#9CA3AF">status:</tspan><tspan fill="#22C55E"> open_to_build</tspan><tspan fill="#D1D5DB"> . say hi on LinkedIn or email</tspan>
      <animate attributeName="opacity" keyTimes="0;0.595;0.625;0.930;0.980;1" values="0;0;1;1;0;0" dur="11.6s" repeatCount="indefinite"/>
    </text>

    <text x="48" y="388" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="17" fill="#60A5FA">$</text>

    <rect x="64" y="373" width="10" height="19" fill="#60A5FA">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <text x="1139" y="366" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="12" fill="#60A5FA" opacity="0">{ }
      <animate attributeName="opacity" values="0;.55;0" dur="5.4s" begin="-3.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 12;0 -44" dur="5.4s" begin="-3.2s" repeatCount="indefinite"/>
    </text>

    <text x="1084" y="294" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="12" fill="#60A5FA" opacity="0">;
      <animate attributeName="opacity" values="0;.55;0" dur="6s" begin="-1.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 12;0 -44" dur="6s" begin="-1.9s" repeatCount="indefinite"/>
    </text>

    <text x="1045" y="161" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="16" fill="#60A5FA" opacity="0">[ ]
      <animate attributeName="opacity" values="0;.55;0" dur="7.6s" begin="-7.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 12;0 -44" dur="7.6s" begin="-7.2s" repeatCount="indefinite"/>
    </text>

    <text x="1137" y="261" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="12" fill="#60A5FA" opacity="0">&amp;&amp;
      <animate attributeName="opacity" values="0;.55;0" dur="7s" begin="-8.1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 12;0 -44" dur="7s" begin="-8.1s" repeatCount="indefinite"/>
    </text>

    <text x="991" y="362" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="12" fill="#60A5FA" opacity="0">[ ]
      <animate attributeName="opacity" values="0;.55;0" dur="6.7s" begin="-8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 12;0 -44" dur="6.7s" begin="-8s" repeatCount="indefinite"/>
    </text>

    <text x="1040" y="181" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="16" fill="#60A5FA" opacity="0">{ }
      <animate attributeName="opacity" values="0;.55;0" dur="5.7s" begin="-1.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 12;0 -44" dur="5.7s" begin="-1.6s" repeatCount="indefinite"/>
    </text>

    <text x="1028" y="380" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="14" fill="#60A5FA" opacity="0">()
      <animate attributeName="opacity" values="0;.55;0" dur="5.7s" begin="-8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 12;0 -44" dur="5.7s" begin="-8s" repeatCount="indefinite"/>
    </text>

    <text x="1084" y="356" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="14" fill="#60A5FA" opacity="0">=&gt;
      <animate attributeName="opacity" values="0;.55;0" dur="8.2s" begin="-3.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 12;0 -44" dur="8.2s" begin="-3.2s" repeatCount="indefinite"/>
    </text>
  </g>

  <rect x="1" y="1" width="1198" height="432" rx="17" stroke="#60A5FA" stroke-opacity=".35" fill="none"/>

  <!-- Optional animated corner accents -->
  <!--
  <path d="M12 30V12H30M1170 12H1188V30M1188 404V422H1170M30 422H12V404"
    stroke="#60A5FA" stroke-width="2" stroke-linecap="round"
    stroke-opacity=".8" fill="none">
    <animate attributeName="stroke-opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/>
  </path>
  -->
</svg>
