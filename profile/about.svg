    <line x1="0" y1="50" x2="1200" y2="50" stroke="#D97706" stroke-opacity=".35"/>
    <circle cx="32" cy="25" r="7" fill="#EF4444"/><circle cx="56" cy="25" r="7" fill="#F59E0B"/><circle cx="80" cy="25" r="7" fill="#22C55E"/>
    <text x="600.0" y="30" text-anchor="middle" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="14" fill="#888888">akash@black-eye: ~/profile</text>
        <text x="48" y="108" xml:space="preserve" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="17" opacity="1"><tspan fill="#F59E0B">$</tspan><tspan fill="#FFFFFF"> whoami</tspan><animate attributeName="opacity" keyTimes="0.000;0.052;0.082;0.930;0.980;1.000" values="0;0;1;1;0;0" dur="11.6s" repeatCount="indefinite"/></text>
    <text x="48" y="136" xml:space="preserve" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="17" opacity="1"><tspan fill="#FBBF24">akash_shingare // full stack developer &amp; product builder</tspan><animate attributeName="opacity" keyTimes="0.000;0.112;0.142;0.930;0.980;1.000" values="0;0;1;1;0;0" dur="11.6s" repeatCount="indefinite"/></text>
    <text x="48" y="164" xml:space="preserve" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="17" opacity="1"><tspan fill="#F59E0B">$</tspan><tspan fill="#FFFFFF"> cat about.md</tspan><animate attributeName="opacity" keyTimes="0.000;0.172;0.202;0.930;0.980;1.000" values="0;0;1;1;0;0" dur="11.6s" repeatCount="indefinite"/></text>
    <text x="48" y="192" xml:space="preserve" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="17" opacity="1"><tspan fill="#F59E0B">&gt;</tspan><tspan fill="#D1D1D1"> Building responsive, dynamic web apps with React.js, Next.js and Node.js</tspan><animate attributeName="opacity" keyTimes="0.000;0.233;0.263;0.930;0.980;1.000" values="0;0;1;1;0;0" dur="11.6s" repeatCount="indefinite"/></text>
    <text x="48" y="220" xml:space="preserve" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="17" opacity="1"><tspan fill="#F59E0B">&gt;</tspan><tspan fill="#D1D1D1"> Clean, user-friendly interfaces with Tailwind CSS and Chakra UI</tspan><animate attributeName="opacity" keyTimes="0.000;0.293;0.323;0.930;0.980;1.000" values="0;0;1;1;0;0" dur="11.6s" repeatCount="indefinite"/></text>
    <text x="48" y="248" xml:space="preserve" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="17" opacity="1"><tspan fill="#F59E0B">&gt;</tspan><tspan fill="#D1D1D1"> Obsessed with performance and a smooth user experience</tspan><animate attributeName="opacity" keyTimes="0.000;0.353;0.383;0.930;0.980;1.000" values="0;0;1;1;0;0" dur="11.6s" repeatCount="indefinite"/></text>
    <text x="48" y="276" xml:space="preserve" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="17" opacity="1"><tspan fill="#F59E0B">&gt;</tspan><tspan fill="#D1D1D1"> REST APIs, Redux, MongoDB, and efficient fixes for complex problems</tspan><animate attributeName="opacity" keyTimes="0.000;0.414;0.444;0.930;0.980;1.000" values="0;0;1;1;0;0" dur="11.6s" repeatCount="indefinite"/></text>
    <text x="48" y="304" xml:space="preserve" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="17" opacity="1"><tspan fill="#F59E0B">&gt;</tspan><tspan fill="#D1D1D1"> Always exploring the latest in web development</tspan><animate attributeName="opacity" keyTimes="0.000;0.474;0.504;0.930;0.980;1.000" values="0;0;1;1;0;0" dur="11.6s" repeatCount="indefinite"/></text>
    <text x="48" y="332" xml:space="preserve" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="17" opacity="1"><tspan fill="#F59E0B">$</tspan><tspan fill="#FFFFFF"> open --to collaborations jobs</tspan><animate attributeName="opacity" keyTimes="0.000;0.534;0.564;0.930;0.980;1.000" values="0;0;1;1;0;0" dur="11.6s" repeatCount="indefinite"/></text>
    <text x="48" y="360" xml:space="preserve" font-family="'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-size="17" opacity="1"><tspan fill="#888888">status:</tspan><tspan fill="#22C55E"> open_to_build</tspan><tspan fill="#D1D1D1"> . say hi on LinkedIn or email</tspan><animate attributeName="opacity" keyTimes="0.000;0.595;0.625;0.930;0.980;1.000" values="0;0;1;1;0;0" dur="11.6s" repeatCount="indefinite"/></text>
