
<svg width="1200" height="300" viewBox="0 0 1200 300"
     fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300">
      <stop stop-color="#080808"/>
      <stop offset="1" stop-color="#19130D"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32"
             patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF"
            stroke-opacity=".055" fill="none"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <circle cx="1050" cy="130" r="180"
          fill="#D97706" fill-opacity=".08"/>

  <rect x="65" y="55" width="4" height="185"
        rx="2" fill="url(#accent)"/>

  <text x="95" y="95" fill="#F59E0B"
        font-family="monospace" font-size="17">
    &lt; BLACK EYE /&gt;
  </text>

  <text x="95" y="160" fill="#FFFFFF"
        font-family="Arial, sans-serif"
        font-size="49" font-weight="700">
    Akash Shingare
  </text>

  <text x="95" y="205" fill="#D1D1D1"
        font-family="Arial, sans-serif" font-size="22">
    Full Stack Developer &amp; Product Builder
  </text>

  <text x="95" y="250" fill="#F59E0B"
        font-family="monospace" font-size="15">
    DESIGN  ·  DEVELOP  ·  BUILD  ·  SHIP
  </text>

  <g transform="translate(900 100)">
    <rect width="210" height="110" rx="12"
          fill="#111111" stroke="#D97706"
          stroke-opacity=".5"/>
    <text x="20" y="32" fill="#F59E0B"
          font-family="monospace" font-size="13">
      developer.status
    </text>
    <circle cx="23" cy="58" r="5" fill="#22C55E"/>
    <text x="37" y="63" fill="#FFFFFF"
          font-family="monospace" font-size="14">
      open_to_build
    </text>
    <text x="20" y="90" fill="#888888"
          font-family="monospace" font-size="12">
      Mumbai, India
    </text>
  </g>
</svg>
