
<svg width="1200" height="300" viewBox="0 0 1200 300"
     fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300">
      <stop stop-color="#080808"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop stop-color="#3B82F6" stop-opacity=".2"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32"
             patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF"
            stroke-opacity=".055" fill="none">
        <animateTransform attributeName="patternTransform"
          type="translate" from="0 0" to="32 32"
          dur="18s" repeatCount="indefinite"/>
      </path>
    </pattern>

    <filter id="blueGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <clipPath id="clip">
      <rect width="1200" height="300" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Background -->
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- Ambient glow -->
    <ellipse cx="1030" cy="140" rx="240" ry="190" fill="url(#glow)"/>
    <circle cx="1040" cy="140" r="100"
            fill="#3B82F6" fill-opacity=".08"
            filter="url(#blueGlow)"/>

    <!-- Decorative code symbols -->
    <g fill="#60A5FA" font-family="'Fira Code', monospace"
       font-size="22" opacity=".16">
      <text x="780" y="65">&lt;/&gt;</text>
      <text x="1130" y="245">{ }</text>
      <text x="735" y="245">01</text>
      <text x="1080" y="65">;</text>
    </g>

    <g fill="#93C5FD" opacity=".5">
      <circle cx="825" cy="105" r="2">
        <animate attributeName="opacity" values=".2;.9;.2"
                 dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1145" cy="90" r="3">
        <animate attributeName="opacity" values=".8;.2;.8"
                 dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="770" cy="185" r="2"/>
    </g>

    <!-- Left accent line -->
    <rect x="65" y="55" width="4" height="185"
          rx="2" fill="url(#accent)"/>

    <rect x="65" y="55" width="4" height="185"
          rx="2" fill="#60A5FA" opacity=".35"
          filter="url(#blueGlow)"/>

    <!-- Brand -->
    <text x="95" y="95" fill="#60A5FA"
          font-family="'Fira Code', monospace"
          font-size="17" letter-spacing="1">
      &lt; BLACK EYE /&gt;
    </text>

    <!-- Main title -->
    <text x="95" y="160" fill="url(#titleGradient)"
          font-family="'Fira Code', 'Cascadia Code', monospace"
          font-size="49" font-weight="700"
          letter-spacing="-1">
      Akash Shingare
    </text>

    <!-- Subtitle -->
    <text x="95" y="205" fill="#D1D5DB"
          font-family="'Fira Code', 'Cascadia Code', monospace"
          font-size="21">
      Full Stack Developer &amp; Product Builder
    </text>

    <!-- Tagline -->
    <text x="95" y="250" fill="#60A5FA"
          font-family="'Fira Code', monospace"
          font-size="15" letter-spacing="1">
      DESIGN  ·  DEVELOP  ·  BUILD  ·  SHIP
    </text>

    <!-- Animated tagline underline -->
    <rect x="95" y="261" width="0" height="2"
          rx="1" fill="url(#accent)">
      <animate attributeName="width"
               values="0;310;310;0"
               keyTimes="0;.4;.8;1"
               dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- Developer status card -->
    <g transform="translate(900 100)">
      <rect width="210" height="110" rx="12"
            fill="#111827" fill-opacity=".9"
            stroke="#60A5FA" stroke-opacity=".5"/>

      <rect x="1" y="1" width="208" height="108" rx="11"
            stroke="#93C5FD" stroke-opacity=".08"/>

      <text x="20" y="32" fill="#60A5FA"
            font-family="'Fira Code', monospace"
            font-size="13">
        developer.status
      </text>

      <circle cx="23" cy="58" r="5" fill="#22C55E">
        <animate attributeName="opacity"
                 values="1;.35;1" dur="2s"
                 repeatCount="indefinite"/>
      </circle>

      <text x="37" y="63" fill="#FFFFFF"
            font-family="'Fira Code', monospace"
            font-size="14">
        open_to_build
      </text>

      <text x="20" y="90" fill="#9CA3AF"
            font-family="'Fira Code', monospace"
            font-size="12">
        Mumbai, India
      </text>
    </g>

    <!-- Bottom border -->
    <path d="M65 285H1135"
          stroke="#60A5FA" stroke-opacity=".25"/>

    <path d="M65 285H250"
          stroke="url(#accent)" stroke-width="2">
      <animate attributeName="d"
        values="M65 285H180;M65 285H330;M65 285H180"
        dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
