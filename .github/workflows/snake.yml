
name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake (BlackEye blue theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: BLACKEYE-ASTRO
          outputs: |
            profile/snake-live.svg?color_snake=#60A5FA&color_dots=#161B22,#1E3A5F,#2563EB,#3B82F6,#93C5FD

      - name: Commit generated file
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update contribution snake"
          add: "profile/snake-live.svg"
